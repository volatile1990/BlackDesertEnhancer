name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      snapshot_outcome: ${{ steps.market-snapshot.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh market snapshot (Arsha with Velia Inn documented fallback)
        id: market-snapshot
        continue-on-error: true
        timeout-minutes: 6
        run: npm run snapshot
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        if: ${{ github.event_name != 'schedule' || steps.market-snapshot.outcome == 'success' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'schedule' || steps.market-snapshot.outcome == 'success' }}
        with:
          path: dist

  deploy:
    if: ${{ github.event_name != 'schedule' || needs.build.outputs.snapshot_outcome == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
